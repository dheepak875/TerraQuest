<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerraQuest Mission Control</title>
    <!-- Joystick Lib -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    <!-- Charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --accent-cyan: #66fcf1;
            --accent-green: #45a29e;
            --text-main: #c5c6c7;
            --font-mono: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            border-bottom: 2px solid var(--accent-cyan);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
        }

        .container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
            max-width: 100%;
            height: calc(100vh - 100px);
            /* Fit screen minus header/footer */
            margin: 0;
            overflow: hidden;
            /* Prevent body scroll */
        }

        /* Layout Columns */
        .main-col {
            display: flex;
            flex-direction: column;
            gap: 15px;
            height: 100%;
        }

        .video-feed {
            flex: 6;
            /* 60% vertical space */
            background-color: #000;
            border: 1px solid var(--accent-green);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            width: 100%;
            height: auto;
            min-height: 0;
        }

        .video-feed img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Fills the box! */
        }

        .thermal-card {
            flex: 4;
            /* 40% vertical space */
            background-color: #000;
            border: 2px solid #e74c3c;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 !important;
            width: 100%;
            min-height: 0;
        }

        #thermal-canvas {
            width: 100%;
            height: 100%;
            object-fit: fill;
            image-rendering: pixelated;
        }



        /* Sensor Column */
        .sensor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 10px;
            height: 100%;
            overflow-y: auto;
            max-height: none;
        }

        .compact-card {
            /* Now handled by grid cells */
            min-height: 0;
            /* Allow shrinking */
            /* justify-content: space-between; inside flex card usually is ok */
        }

        /* Override generic card */
        .card {
            background-color: var(--card-bg);
            border-left: 5px solid var(--accent-cyan);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            /* Reset padding for compact */
            padding: 5px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2px;
        }

        .card-title {
            font-size: 0.75rem;
            color: var(--accent-green);
            text-transform: uppercase;
        }

        .card-value-display {
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            font-family: var(--font-mono);
        }

        .unit {
            font-size: 0.7rem;
            color: #aaa;
        }

        canvas {
            max-height: 50px;
            /* Force smaller size */
            width: 100%;
        }

        /* Air Quality Badge */
        .aq-badge {
            padding: 1px 5px;
            border-radius: 3px;
            font-size: 0.7rem;
            font-weight: bold;
            color: #fff;
        }

        .aq-good {
            background-color: #27ae60;
        }

        .aq-fair {
            background-color: #f39c12;
        }

        .aq-poor {
            background-color: #c0392b;
        }

        footer {
            margin-top: 10px;
            text-align: center;
            font-size: 0.7rem;
            color: #555;
        }

        /* ... utilities ... */

        .video-overlay {
            font-size: 0.8rem;
            top: 5px;
            left: 5px;
        }

        /* Mobile adjust */
        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
                height: auto;
                overflow: auto;
            }

            .video-feed {
                height: 300px;
                flex: none;
            }

            .thermal-card {
                height: 200px;
                flex: none;
            }

            .sensor-grid {
                height: auto;
                grid-template-columns: 1fr 1fr;
            }
        }

        .btn {
            padding: 10px 20px;
            font-family: var(--font-mono);
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 0 10px;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 1;
        }

        .btn-start {
            background-color: var(--accent-green);
            color: white;
        }

        .btn-stop {
            background-color: #e74c3c;
            color: white;
        }
    </style>
</head>

<body>

    <header>
        <h1>TerraQuest // Mission Control</h1>
        <div style="font-family: var(--font-mono); font-size: 0.9rem; margin-top: 5px;">STATUS: <span
                id="mission-status">IDLE</span> // CONNECTION: SECURE</div>
        <div style="margin-top: 15px;">
            <button id="btn-start" class="btn btn-start" onclick="toggleMission(true)">START MISSION</button>
            <button id="btn-stop" class="btn btn-stop" onclick="toggleMission(false)">STOP MISSION</button>
        </div>
    </header>

    <div class="container">
        <!-- Live Video Feed -->
        <div class="video-feed">
            <div class="video-overlay">• LIVE FEED</div>
            <img id="camera-stream" src="" alt="Waiting for Video Signal...">

            <!-- Manual Controls Overlay -->
            <div id="joystick-zone"></div>
            <div class="cam-controls">
                <div>Pan: <input type="range" min="-90" max="90" value="0" oninput="updateCam(this.value, null)"></div>
                <div style="margin-top:5px;">Tilt: <input type="range" min="-35" max="65" value="0"
                        oninput="updateCam(null, this.value)"></div>
            </div>
        </div>

        <!-- Thermal Feed (New) -->
        <div class="card" style="padding:0; overflow:hidden; position:relative;">
            <div class="video-overlay" style="color:#e74c3c">• THERMAL</div>
            <canvas id="thermal-canvas" width="32" height="24"
                style="width:100%; height:100%; object-fit:contain; image-rendering: pixelated;"></canvas>
        </div>

        <!-- Sensor Data -->
        <div class="sensor-grid">
            <!-- Metal Detector (Primary) -->
            <div class="card" id="mag-card">
                <div class="card-header">
                    <div class="card-title">Metal Detector</div>
                    <span id="mag-status" class="aq-badge aq-good">CLEAR</span>
                </div>
                <!-- Field Strength & Anomaly Score -->
                <div style="display:flex; justify-content:space-between; align-items:flex-end;">
                    <div class="card-value-display"><span id="mag-strength">--</span> <span class="unit">µT</span></div>
                    <div style="font-size:0.8rem; color:#aaa;">ANOMALY: <span id="mag-anomaly"
                            style="color:#e74c3c">0</span></div>
                </div>
                <canvas id="chart-mag"></canvas>
            </div>

            <!-- Humidity & Pressure -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title">Atmosphere</div>
                    <div class="card-value-display">
                        <span id="humidity">--</span><span class="unit">%</span> /
                        <span id="pressure" style="font-size:1rem">--</span><span class="unit">hPa</span>
                    </div>
                </div>
                <!-- Dual line graph? just humidity for now to keep it clean -->
                <canvas id="chart-humid"></canvas>
            </div>

            <!-- Air Quality -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title">Air Quality</div>
                    <span id="aq-badge" class="aq-badge aq-good">GOOD</span>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                    <div class="card-value-display"><span id="co2">--</span> <span class="unit">Ω</span></div>
                    <div style="font-size:0.8rem; color:#888;">Higher = Cleaner</div>
                </div>
                <canvas id="chart-gas"></canvas>
            </div>

            <!-- Positional -->
            <div class="card" style="flex-direction:row; justify-content:space-between; align-items:center;">
                <div>
                    <div class="card-title">Obstacle Dist</div>
                    <div class="card-value-display"><span id="moisture">--</span> <span class="unit">cm</span></div>
                </div>
                <div style="text-align:right">
                    <div class="card-title">Altitude</div>
                    <div class="card-value-display"><span id="altitude">--</span> <span class="unit">m</span></div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        System ID: TQ-PROTO-01 | Latency: <span id="ping">12</span>ms
    </footer>

    <script>
        // --- Setup Charts ---
        Chart.defaults.color = '#888';
        Chart.defaults.borderColor = '#333';

        function createChart(ctx, label, color) {
            return new Chart(ctx, {
                type: 'line',
                data: {
                    labels: Array(30).fill(''),
                    datasets: [{
                        label: label,
                        data: Array(30).fill(null),
                        borderColor: color,
                        tension: 0.4,
                        borderWidth: 2,
                        pointRadius: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { display: false },
                        y: { display: true }
                    },
                    animation: { duration: 0 }
                }
            });
        }

        const chartMag = createChart(document.getElementById('chart-mag'), 'Mag Field', '#f1c40f');
        const chartHumid = createChart(document.getElementById('chart-humid'), 'Humidity', '#3498db');
        const chartGas = createChart(document.getElementById('chart-gas'), 'Gas Res', '#2ecc71');

        function updateChart(chart, val) {
            const data = chart.data.datasets[0].data;
            data.push(val);
            data.shift();
            chart.update();
        }

        // --- Audio System ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let audioEnabled = false;

        function playBeep(frequency = 1000, duration = 0.1) {
            if (!audioEnabled) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        // Resume audio on first click
        document.body.addEventListener('click', () => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            audioEnabled = true;
        }, { once: true });

        // --- Core Logic ---

        const protocol = window.location.protocol;
        const hostname = window.location.hostname;
        document.getElementById('camera-stream').src = `http://${hostname}:9000/mjpg`;

        async function updateSensors() {
            try {
                const response = await fetch('/data');
                const data = await response.json();

                // Values
                // document.getElementById('temp').innerText = data.temp; // Removed Temp Card
                document.getElementById('humidity').innerText = data.humidity;
                document.getElementById('pressure').innerText = data.pressure;
                document.getElementById('co2').innerText = data.co2;
                document.getElementById('moisture').innerText = data.moisture;
                document.getElementById('altitude').innerText = data.altitude;

                // Mag Data
                const magStrength = data.magnetic;
                const magAnomaly = data.mag_anomaly;
                document.getElementById('mag-strength').innerText = magStrength;
                document.getElementById('mag-anomaly').innerText = magAnomaly;

                // Ping
                document.getElementById('ping').innerText = Math.floor(Math.random() * 20) + 10;

                // Charts
                updateChart(chartMag, magStrength);
                updateChart(chartHumid, data.humidity);
                updateChart(chartGas, data.co2);

                // Metal Detection Logic
                const magCard = document.getElementById('mag-card');
                const magStatus = document.getElementById('mag-status');

                // Threshold for detection (tuned based on earlier test ~1000-2000 jump)
                if (magAnomaly > 1500) {
                    magStatus.innerText = "DETECTED!";
                    magStatus.className = "aq-badge aq-poor"; // Red
                    // Flash Effect
                    if (Date.now() % 500 < 250) {
                        magCard.style.backgroundColor = "#c0392b";
                    } else {
                        magCard.style.backgroundColor = "var(--card-bg)";
                    }
                    // Audio Alert (Geiger style)
                    if (Math.random() > 0.5) playBeep(2000 + Math.random() * 500, 0.05);

                } else {
                    magStatus.innerText = "Scanning...";
                    magStatus.className = "aq-badge aq-good"; // Green
                    magCard.style.backgroundColor = "var(--card-bg)";
                }

                // AQI Logic (Gas Resistance)
                // > 50k = Excellent, 10k-50k = Good, < 10k = Poor
                const gas = data.co2;
                const badge = document.getElementById('aq-badge');
                if (gas > 50000) {
                    badge.innerText = "EXCELLENT";
                    badge.className = "aq-badge aq-good";
                } else if (gas > 10000) {
                    badge.innerText = "GOOD";
                    badge.className = "aq-badge aq-fair";
                } else {
                    badge.innerText = "POOR";
                    badge.className = "aq-badge aq-poor";
                }

            } catch (error) {
                console.error('Error fetching sensor data:', error);
            }
        }

        async function toggleMission(active) {
            const endpoint = active ? '/api/mission/start' : '/api/mission/stop';
            try {
                const res = await fetch(endpoint, { method: 'POST' });
                const data = await res.json();
                updateMissionUI(data.active);
            } catch (e) {
                console.error("Mission toggle failed", e);
            }
        }

        function updateMissionUI(active) {
            const statusEl = document.getElementById('mission-status');
            if (active) {
                statusEl.innerText = "ACTIVE";
                statusEl.style.color = "var(--accent-cyan)";
            } else {
                statusEl.innerText = "IDLE";
                statusEl.style.color = "#888";
            }
        }

        async function checkStatus() {
            try {
                const res = await fetch('/api/mission/status');
                const data = await res.json();
                updateMissionUI(data.active);
            } catch (e) { }
        }

        const thermalCanvas = document.getElementById('thermal-canvas');
        const thermalCtx = thermalCanvas.getContext('2d');

        async function updateThermal() {
            try {
                const res = await fetch('/api/thermal');
                const data = await res.json();
                if (!data || data.length !== 768) return;

                const imgData = thermalCtx.createImageData(32, 24);

                // Simple auto-scaling color map
                let minT = 20; // fixed range for stability or
                let maxT = 35; // dynamic range

                // Optional: Dynamic range 
                // minT = Math.min(...data);
                // maxT = Math.max(...data);

                for (let i = 0; i < 768; i++) {
                    const temp = data[i];
                    const t = (temp - minT) / (maxT - minT); // norm 0-1

                    // Simple Heatmap: Blue -> Green -> Red
                    let r = 0, g = 0, b = 0;
                    if (t < 0.5) {
                        // Blue to Green
                        b = 255 * (1 - t * 2);
                        g = 255 * (t * 2);
                    } else {
                        // Green to Red
                        g = 255 * (1 - (t - 0.5) * 2);
                        r = 255 * ((t - 0.5) * 2);
                    }

                    const idx = i * 4;
                    imgData.data[idx] = r;     // R
                    imgData.data[idx + 1] = g; // G
                    imgData.data[idx + 2] = b; // B
                    imgData.data[idx + 3] = 255; // Alpha
                }
                thermalCtx.putImageData(imgData, 0, 0);

            } catch (e) { }
        }

        // Polling Rates
        setInterval(updateSensors, 100); // 10Hz for fast Metal Detector response
        setInterval(updateThermal, 500); // 2Hz for thermal (heavy payload)
        setInterval(checkStatus, 2000);  // Low priority status checks

        // --- Manual Control Logic ---
        var joystickManager = nipplejs.create({
            zone: document.getElementById('joystick-zone'),
            mode: 'static',
            position: { left: '50%', top: '50%' },
            color: 'cyan'
        });

        joystickManager.on('move', function (evt, data) {
            if (!data.vector) return;
            const speed = Math.round(data.vector.y * 100);
            const angle = Math.round(data.vector.x * 35);
            sendMove(speed, angle);
        });

        joystickManager.on('end', function () {
            sendMove(0, 0);
        });

        let currentPan = 0;
        let currentTilt = 0;
        function updateCam(pan, tilt) {
            if (pan !== null) currentPan = parseInt(pan);
            if (tilt !== null) currentTilt = parseInt(tilt);

            fetch('/api/control/camera', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pan: currentPan, tilt: currentTilt })
            });
        }

        let lastMoveTime = 0;
        function sendMove(speed, angle) {
            const now = Date.now();
            if (now - lastMoveTime < 100 && speed !== 0) return;
            lastMoveTime = now;

            fetch('/api/control/move', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ speed: speed, angle: angle })
            });
        }
    </script>
</body>


</html>
