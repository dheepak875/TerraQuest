<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerraQuest Mission Control</title>
    <!-- Joystick Lib -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    <!-- Charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --accent-cyan: #66fcf1;
            --accent-green: #45a29e;
            --text-main: #c5c6c7;
            --font-mono: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            border-bottom: 2px solid var(--accent-cyan);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
        }

        .container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Video Feed Section */
        .video-feed {
            background-color: #000;
            border: 1px solid var(--accent-green);
            border-radius: 8px;
            height: 480px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            position: relative;
            overflow: hidden;
        }

        /* Joystick Zone */
        #joystick-zone {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 150px;
            height: 150px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            z-index: 10;
        }

        /* Camera Controls */
        .cam-controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px;
            border-radius: 8px;
            color: white;
            z-index: 10;
        }

        .cam-controls input {
            vertical-align: middle;
        }

        .video-feed img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            color: red;
            font-weight: bold;
            font-family: var(--font-mono);
            animation: blink 1s infinite;
        }

        /* Sensor Grid */
        .sensor-grid {
            display: grid;
            grid-template-rows: repeat(4, 1fr);
            gap: 15px;
            max-height: 800px;
            overflow-y: auto;
        }

        .card {
            background-color: var(--card-bg);
            border-left: 5px solid var(--accent-cyan);
            border-radius: 4px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            min-height: 120px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .card-title {
            font-size: 0.85rem;
            color: var(--accent-green);
            text-transform: uppercase;
        }

        .card-value-display {
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
            font-family: var(--font-mono);
        }

        .unit {
            font-size: 0.8rem;
            color: #aaa;
        }

        canvas {
            max-height: 80px;
            width: 100%;
        }

        /* Air Quality Badge */
        .aq-badge {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            color: #fff;
        }

        .aq-good {
            background-color: #27ae60;
        }

        .aq-fair {
            background-color: #f39c12;
        }

        .aq-poor {
            background-color: #c0392b;
        }

        footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.8rem;
            color: #555;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }

            .video-feed {
                height: 300px;
            }

            .sensor-grid {
                grid-template-columns: 1fr 1fr;
                grid-template-rows: auto;
            }
        }

        .btn {
            padding: 10px 20px;
            font-family: var(--font-mono);
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 0 10px;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 1;
        }

        .btn-start {
            background-color: var(--accent-green);
            color: white;
        }

        .btn-stop {
            background-color: #e74c3c;
            color: white;
        }
    </style>
</head>

<body>

    <header>
        <h1>TerraQuest // Mission Control</h1>
        <div style="font-family: var(--font-mono); font-size: 0.9rem; margin-top: 5px;">STATUS: <span
                id="mission-status">IDLE</span> // CONNECTION: SECURE</div>
        <div style="margin-top: 15px;">
            <button id="btn-start" class="btn btn-start" onclick="toggleMission(true)">START MISSION</button>
            <button id="btn-stop" class="btn btn-stop" onclick="toggleMission(false)">STOP MISSION</button>
        </div>
    </header>

    <div class="container">
        <!-- Live Video Feed -->
        <div class="video-feed">
            <div class="video-overlay">• LIVE FEED</div>
            <img id="camera-stream" src="" alt="Waiting for Video Signal...">
            <!-- Manual Controls Overlay -->
            <div id="joystick-zone"></div>
            <div class="cam-controls">
                <div>Pan: <input type="range" min="-90" max="90" value="0" oninput="updateCam(this.value, null)"></div>
                <div style="margin-top:5px;">Tilt: <input type="range" min="-35" max="65" value="0"
                        oninput="updateCam(null, this.value)"></div>
            </div>
        </div>

        <!-- Sensor Data -->
        <div class="sensor-grid">
            <!-- Temp -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title">Temperature</div>
                    <div class="card-value-display"><span id="temp">--</span> <span class="unit">°C</span></div>
                </div>
                <canvas id="chart-temp"></canvas>
            </div>

            <!-- Humidity & Pressure -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title">Atmosphere</div>
                    <div class="card-value-display">
                        <span id="humidity">--</span><span class="unit">%</span> /
                        <span id="pressure" style="font-size:1rem">--</span><span class="unit">hPa</span>
                    </div>
                </div>
                <!-- Dual line graph? just humidity for now to keep it clean -->
                <canvas id="chart-humid"></canvas>
            </div>

            <!-- Air Quality -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title">Air Quality (VOC)</div>
                    <span id="aq-badge" class="aq-badge aq-good">GOOD</span>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                    <div class="card-value-display"><span id="co2">--</span> <span class="unit">Ω</span></div>
                    <div style="font-size:0.8rem; color:#888;">Higher = Cleaner</div>
                </div>
                <canvas id="chart-gas"></canvas>
            </div>

            <!-- Positional -->
            <div class="card" style="flex-direction:row; justify-content:space-between; align-items:center;">
                <div>
                    <div class="card-title">Obstacle Dist</div>
                    <div class="card-value-display"><span id="moisture">--</span> <span class="unit">cm</span></div>
                </div>
                <div style="text-align:right">
                    <div class="card-title">Altitude</div>
                    <div class="card-value-display"><span id="altitude">--</span> <span class="unit">m</span></div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        System ID: TQ-PROTO-01 | Latency: <span id="ping">12</span>ms
    </footer>

    <script>
        // --- Setup Charts ---
        Chart.defaults.color = '#888';
        Chart.defaults.borderColor = '#333';

        function createChart(ctx, label, color) {
            return new Chart(ctx, {
                type: 'line',
                data: {
                    labels: Array(30).fill(''),
                    datasets: [{
                        label: label,
                        data: Array(30).fill(null),
                        borderColor: color,
                        tension: 0.4,
                        borderWidth: 2,
                        pointRadius: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { display: false },
                        y: { display: true }
                    },
                    animation: { duration: 0 }
                }
            });
        }

        const chartTemp = createChart(document.getElementById('chart-temp'), 'Temp', '#e74c3c');
        const chartHumid = createChart(document.getElementById('chart-humid'), 'Humidity', '#3498db');
        const chartGas = createChart(document.getElementById('chart-gas'), 'Gas Res', '#2ecc71');

        function updateChart(chart, val) {
            const data = chart.data.datasets[0].data;
            data.push(val);
            data.shift();
            chart.update();
        }

        // --- Core Logic ---

        const protocol = window.location.protocol;
        const hostname = window.location.hostname;
        document.getElementById('camera-stream').src = `http://${hostname}:9000/mjpg`;

        async function updateSensors() {
            try {
                const response = await fetch('/data');
                const data = await response.json();

                // Values
                document.getElementById('temp').innerText = data.temp;
                document.getElementById('humidity').innerText = data.humidity;
                document.getElementById('pressure').innerText = data.magnetic; // mapped from backend
                document.getElementById('co2').innerText = data.co2;
                document.getElementById('moisture').innerText = data.moisture;
                document.getElementById('altitude').innerText = data.altitude;

                // Ping
                document.getElementById('ping').innerText = Math.floor(Math.random() * 20) + 10;

                // Charts
                updateChart(chartTemp, data.temp);
                updateChart(chartHumid, data.humidity);
                updateChart(chartGas, data.co2);

                // AQI Logic (Gas Resistance)
                // > 50k = Excellent, 10k-50k = Good, < 10k = Poor
                const gas = data.co2;
                const badge = document.getElementById('aq-badge');
                if (gas > 50000) {
                    badge.innerText = "EXCELLENT";
                    badge.className = "aq-badge aq-good";
                } else if (gas > 10000) {
                    badge.innerText = "GOOD";
                    badge.className = "aq-badge aq-fair";
                } else {
                    badge.innerText = "POOR (VOCs)";
                    badge.className = "aq-badge aq-poor";
                }

            } catch (error) {
                console.error('Error fetching sensor data:', error);
            }
        }

        async function toggleMission(active) {
            const endpoint = active ? '/api/mission/start' : '/api/mission/stop';
            try {
                const res = await fetch(endpoint, { method: 'POST' });
                const data = await res.json();
                updateMissionUI(data.active);
            } catch (e) {
                console.error("Mission toggle failed", e);
            }
        }

        function updateMissionUI(active) {
            const statusEl = document.getElementById('mission-status');
            if (active) {
                statusEl.innerText = "ACTIVE";
                statusEl.style.color = "var(--accent-cyan)";
            } else {
                statusEl.innerText = "IDLE";
                statusEl.style.color = "#888";
            }
        }

        async function checkStatus() {
            try {
                const res = await fetch('/api/mission/status');
                const data = await res.json();
                updateMissionUI(data.active);
            } catch (e) { }
        }

        setInterval(updateSensors, 1000); // 1Hz update for graphs
        setInterval(checkStatus, 2000);

        // --- Manual Control Logic ---
        var joystickManager = nipplejs.create({
            zone: document.getElementById('joystick-zone'),
            mode: 'static',
            position: { left: '50%', top: '50%' },
            color: 'cyan'
        });

        joystickManager.on('move', function (evt, data) {
            if (!data.vector) return;
            const speed = Math.round(data.vector.y * 100);
            const angle = Math.round(data.vector.x * 35);
            sendMove(speed, angle);
        });

        joystickManager.on('end', function () {
            sendMove(0, 0);
        });

        let currentPan = 0;
        let currentTilt = 0;
        function updateCam(pan, tilt) {
            if (pan !== null) currentPan = parseInt(pan);
            if (tilt !== null) currentTilt = parseInt(tilt);

            fetch('/api/control/camera', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pan: currentPan, tilt: currentTilt })
            });
        }

        let lastMoveTime = 0;
        function sendMove(speed, angle) {
            const now = Date.now();
            if (now - lastMoveTime < 100 && speed !== 0) return;
            lastMoveTime = now;

            fetch('/api/control/move', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ speed: speed, angle: angle })
            });
        }
    </script>
</body>


</html>
