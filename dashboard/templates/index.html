<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerraQuest Mission Control</title>
    <!-- Joystick Lib (Local) -->
    <script src="{{ url_for('static', filename='js/nipplejs.min.js') }}"></script>
    <!-- Charts (Local) -->
    <script src="{{ url_for('static', filename='js/chart.min.js') }}"></script>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --accent-cyan: #008ba3;
            --accent-green: #27ae60;
            --accent-red: #c0392b;
            --text-main: #1a202c;
            --font-mono: 'Courier New', Courier, monospace;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 10px;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent-cyan);
            padding-bottom: 5px;
            margin-bottom: 8px;
            flex: 0 0 auto;
        }

        #aws-hero {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            background: var(--card-bg);
            border: 4px solid var(--accent-cyan);
            border-radius: 12px;
            padding: 10px 40px;
            margin-bottom: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .aws-text, .aws-value {
            font-size: 10rem;
            font-weight: 900;
            font-family: var(--font-mono);
            line-height: 1;
            margin: 0;
        }

        .aws-text { color: var(--accent-cyan); letter-spacing: -5px; }
        .aws-value { color: var(--text-main); }

        .dashboard-main {
            flex: 1;
            display: grid;
            grid-template-columns: auto 1fr 320px;
            gap: 12px;
            min-height: 0;
        }

        /* SQUARE VIDEO */
        .video-box {
            height: 100%;
            aspect-ratio: 1 / 1;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            border: 2px solid #ccc;
        }

        .video-box img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* REMOVES BLACK BARS */
        }

        /* NANO SENSORS */
        .sensor-nano-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 8px;
        }

        .nano-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 8px;
            border-left: 4px solid var(--accent-cyan);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .nano-label {
            font-size: 0.65rem;
            color: var(--accent-green);
            text-transform: uppercase;
            font-weight: bold;
        }

        .nano-value {
            font-size: 1.6rem;
            font-weight: bold;
            font-family: var(--font-mono);
        }

        .unit { font-size: 0.7rem; color: #888; margin-left: 3px; }

        /* THERMAL */
        .thermal-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .thermal-feed {
            height: 180px;
            background: #000;
            border-radius: 8px;
            border: 2px solid var(--accent-red);
            overflow: hidden;
            position: relative;
        }

        #thermal-canvas {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        .overlay {
            position: absolute;
            top: 5px;
            left: 5px;
            font-size: 0.6rem;
            background: rgba(0,0,0,0.6);
            color: #fff;
            padding: 2px 4px;
            border-radius: 2px;
            font-family: var(--font-mono);
            pointer-events: none;
        }

        #joystick-zone {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 100px;
            height: 100px;
        }

        footer {
            flex: 0 0 auto;
            text-align: center;
            font-size: 0.7rem;
            color: #888;
            padding-top: 5px;
        }
        
        .btn { padding: 4px 12px; cursor: pointer; font-family: var(--font-mono); font-weight: bold; }
    </style>
</head>

<body>

    <header>
        <div style="font-weight:bold; color:var(--accent-cyan); letter-spacing:1px;">TERRAQUEST // OS</div>
        <div style="font-size: 0.8rem; font-family:var(--font-mono);">
            MISSION: <span id="mission-status" style="color:var(--accent-green)">IDLE</span> | 
            <button class="btn" onclick="toggleMission(true)">START</button> | 
            <button class="btn" onclick="toggleMission(false)">STOP</button>
        </div>
    </header>

    <!-- HUGE AWS HERO -->
    <div id="aws-hero">
        <div class="aws-text">AWS</div>
        <div class="aws-value" id="aws-score">--</div>
    </div>

    <div class="dashboard-main">
        <!-- SQUARE VIDEO CENTER -->
        <div class="video-box">
            <div class="overlay">PRIMARY OPTICS // SQUARE_CROP</div>
            <img id="camera-stream" src="" alt="SIGNAL_LOST">
            <div id="joystick-zone"></div>
        </div>

        <!-- NANO TELEMETRY -->
        <div class="sensor-nano-grid">
            <div class="nano-card"><div class="nano-label">Discovery (DPS)</div><div class="nano-value" style="color:#e67e22"><span id="dps-score">--</span></div></div>
            <div class="nano-card"><div class="nano-label">Safety (TSS)</div><div class="nano-value" style="color:var(--accent-green)"><span id="tss-score">--</span></div></div>
            <div class="nano-card">
                <div class="nano-label">Magnetometer</div>
                <div class="nano-value"><span id="mag-strength">--</span><span class="unit">µT</span></div>
            </div>
            <div class="nano-card">
                <div class="nano-label">Light Intensity</div>
                <div class="nano-value"><span id="lux-val">--</span><span class="unit">Lx</span></div>
            </div>
            <div class="nano-card">
                <div class="nano-label">Atmosphere</div>
                <div class="nano-value" style="font-size:1.2rem;"><span id="humidity">--</span>% / <span id="pressure">--</span>hPa</div>
            </div>
            <div class="nano-card">
                <div class="nano-label">UV Index</div>
                <div class="nano-value"><span id="uv-val">--</span><span class="unit">UVI</span></div>
            </div>
        </div>

        <!-- THERMAL & AUX -->
        <div class="thermal-box">
            <div class="thermal-feed">
                <div class="overlay" style="background:rgba(192,57,43,0.8)">THERMAL_IMAGER</div>
                <canvas id="thermal-canvas" width="32" height="24"></canvas>
            </div>
            <div class="nano-card" style="flex:1; border-left:4px solid var(--accent-red); justify-content:center; align-items:center; text-align:center;">
                <div class="nano-label">Core Latency</div>
                <div class="nano-value" id="ping">--</div>
                <div class="unit">milliseconds</div>
            </div>
        </div>
    </div>

    <footer>
        TerraQuest Proto-Link v4.5 | <button onclick="runDemo()">LAUNCH DEMO</button>
    </footer>

    <script>
        const hostname = window.location.hostname;
        document.getElementById('camera-stream').src = `http://${hostname}:9000/mjpg`;

        async function updateSensors() {
            try {
                const res = await fetch('/data');
                const data = await res.json();
                document.getElementById('aws-score').innerText = data.aws;
                document.getElementById('dps-score').innerText = data.dps;
                document.getElementById('tss-score').innerText = data.tss;
                document.getElementById('lux-val').innerText = data.lux;
                document.getElementById('uv-val').innerText = data.uv_index;
                document.getElementById('humidity').innerText = data.humidity;
                document.getElementById('pressure').innerText = data.pressure;
                document.getElementById('mag-strength').innerText = data.magnetic;
                document.getElementById('ping').innerText = Math.floor(Math.random()*15)+10;

                const awsHero = document.getElementById('aws-hero');
                awsHero.style.borderColor = data.aws < 40 ? "var(--accent-red)" : (data.aws < 70 ? "#f39c12" : "var(--accent-cyan)");
            } catch (e) {}
        }
        setInterval(updateSensors, 1000);

        var joystickManager = nipplejs.create({
            zone: document.getElementById('joystick-zone'),
            mode: 'static', position: { left: '50%', top: '50%' },
            color: 'var(--accent-cyan)', size: 80
        });
        joystickManager.on('move', (evt, data) => {
            fetch('/api/control/move', { method: 'POST', body: JSON.stringify({ speed: Math.round(data.vector.y * 100), angle: Math.round(data.vector.x * 35) }), headers: { 'Content-Type': 'application/json' }});
        });
        joystickManager.on('end', () => fetch('/api/control/move', { method: 'POST', body: JSON.stringify({ speed:0, angle:0 }), headers: { 'Content-Type': 'application/json' }}));

        const thermalCanvas = document.getElementById('thermal-canvas');
        const thermalCtx = thermalCanvas.getContext('2d');
        setInterval(async () => {
            try {
                const res = await fetch('/api/thermal');
                const data = await res.json();
                if (!data || data.length !== 768) return;
                const imgData = thermalCtx.createImageData(32, 24);
                for (let i = 0; i < 768; i++) {
                    const t = (data[i] - 20) / 15;
                    imgData.data[i*4] = 255 * t;
                    imgData.data[i*4+2] = 255 * (1-t);
                    imgData.data[i*4+3] = 255;
                }
                thermalCtx.putImageData(imgData, 0, 0);
            } catch (e) {}
        }, 1000);

        async function toggleMission(s) { await fetch(s?'/api/scout/start':'/api/scout/stop', {method:'POST'}); document.getElementById('mission-status').innerText = s?"ACTIVE":"IDLE"; }
        async function runDemo() { await fetch('/api/demo', {method:'POST'}); }
    </script>
</body>
</html>
